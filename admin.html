<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | World Broadcast Biographies</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="js/admin.js"></script></head><body><header><a class="brand" href="index.html">WB <b>WORLD BROADCAST BIOGRAPHIES</b></a><a href="index.html">← Website</a></header><main class="admin"><p class="eyebrow">PRIVATE AREA</p><h1>Website <em>Admin.</em></h1><section id="login" class="panel"><h2>Administrator login</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="btn">Sign in</button></form><p id="loginMsg"></p><small>Create your admin user in Supabase Authentication. Database policies must be configured before publishing.</small></section><section id="editor" class="panel" hidden><div class="between"><h2>Biography editor</h2><button id="logout" type="button">Sign out</button></div><form id="bioForm"><input id="id" type="hidden"><label>Name *<input id="name" required></label><label>Role *<input id="role" required></label><label>Country<input id="country"></label><label>Category<select id="cat"><option>Presenters & Journalists</option><option>Commentators</option><option>Producers & Directors</option><option>Camera & Audio</option><option>Broadcast Engineering</option><option>Live Production</option><option>Other</option></select></label><label>Short introduction *<textarea id="summary" required maxlength="320"></textarea></label><label>Full biography *<textarea id="bio" required rows="8"></textarea></label><label>LinkedIn URL<input id="linkedin" type="url"></label><label>Photo (JPG/PNG/WebP, max 2 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Sources (one URL per line) *<textarea id="sources" required></textarea></label><label class="check"><input id="published" type="checkbox" checked> Publish immediately</label><button class="btn">Save biography</button><button id="clear" type="button">Clear</button></form><p id="editorMsg"></p><h2>Existing biographies</h2><div id="entries"></div></section></main><footer>Private administration · Keep credentials private.</footer></body></html>
