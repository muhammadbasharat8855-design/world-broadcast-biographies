<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · Broadcast Biographies</title><link rel="stylesheet" href="assets/style.css"></head>
<body><header class="site-header"><a class="brand" href="./">BROADCAST <span>BIOGRAPHIES</span></a><a class="admin-link" href="./">View website</a></header>
<main class="admin-main"><section class="admin-intro"><p class="eyebrow">CONTENT MANAGEMENT</p><h1>Admin panel</h1><p class="muted">Sign in with the administrator account you create in Supabase.</p></section>
<section id="loginPanel" class="panel"><h2>Administrator login</h2><form id="loginForm" class="stack"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="loginMessage" class="notice"></p></section>
<section id="dashboard" class="hidden">
<div class="panel"><div class="section-heading"><h2 id="formTitle">Add a biography</h2><button id="logout" class="secondary" type="button">Sign out</button></div>
<form id="bioForm" class="stack"><input id="bioId" type="hidden"><label>Broadcaster name<input id="name" required maxlength="120" placeholder="Full name"></label><label>Role / specialty<input id="role" maxlength="160" placeholder="TV presenter, radio host, producer…"></label><label>Country<input id="country" maxlength="100" placeholder="Country"></label><label>Photo URL<input id="photo" type="url" placeholder="https://… (optional)"></label><label>Biography<textarea id="story" rows="8" required placeholder="Write the broadcaster's life story…"></textarea></label><label>LinkedIn post URL<input id="linkedin" type="url" placeholder="https://www.linkedin.com/posts/…"></label><label class="check"><input id="published" type="checkbox" checked> Publish on website</label><div class="actions"><button type="submit">Save biography</button><button id="resetForm" class="secondary" type="button">Clear form</button></div><p id="formMessage" class="notice"></p></form></div>
<div class="panel"><h2>Existing biographies</h2><div id="adminStories" class="admin-stories">Loading…</div></div>
</section></main><footer>Keep your Supabase admin credentials private.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/admin.js"></script></body></html>
